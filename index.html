<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <title>Super Mario Bros</title>
</head>
<body>
    <section class="logo">
        <img src="/imagens/logo.png" alt="">
    </section>
    <section id="" class="escolhas">
        <a class="escolhas_child" href="#personagens">Novo Jogo</a>
        <a class="escolhas_child" href="#personagens">Carregar Jogo</a>
    </section>
    <section class="personagens" id="personagens">
        <h1 class="personagens_h1">Escolha seu Personagem</h1>
        <div class="personagens_personas">
        <div class="personagens_personas_child">
            <img class="personagens_personas_child_img" src="./imagens/personagens/mario.jpg" alt="Mario">
            <h2 class="personagens_personas_child_texto">Mario</h2>
        </div>
        <div class="personagens_personas_child">
            <img class="personagens_personas_child_img" src="./imagens/personagens/luigi.jpg" alt="Mario">
            <h2 class="personagens_personas_child_texto">Luigi</h2>
        </div>
        <div class="personagens_personas_child">
            <img class="personagens_personas_child_img" src="./imagens/personagens/yoshi.jpg" alt="Mario">
            <h2 class="personagens_personas_child_texto">Yoshi</h2>
        </div>
        <div class="personagens_personas_child">
            <img class="personagens_personas_child_img" src="./imagens/personagens/toad.jpg" alt="Mario">
            <h2 class="personagens_personas_child_texto">Toad</h2>
        </div>
        </div>
    </section>
    <section class="poderes" id="poderes">
        <h1 class="poderes_h1">Colete Poderes Especiais</h1>
        <div class="poderes_parent">
        <img class="poderes_child" src="./imagens/poderes/cogumelo-vermelho.jpg" alt="">
        <img class="poderes_child" src="./imagens/poderes/cogumelo-verde.jpg" alt="">
        <img class="poderes_child" src="./imagens/poderes/cogumelo-azul.jpg" alt="">
        <img class="poderes_child" src="./imagens/poderes/flor-fogo.jpg" alt="">
        <img class="poderes_child" src="./imagens/poderes/flor-gelo.jpg" alt="">
        <img class="poderes_child" src="./imagens/poderes/cogumelo-voador.jpg" alt="">
        <img class="poderes_child" src="./imagens/poderes/estrela.jpg" alt="">
        <img class="poderes_child" src="./imagens/poderes/pinguim.jpg" alt="">
            </div>
    </section>
    <section class="viloes" id="viloes">
        <h1 class="viloes_h1">Enfrente Inimigos</h1>

        <div class="viloes_lista">
            <img class="viloes_child" id="mario" src="./imagens/personagens/mario.jpg" alt="">
            
            <div class="viloes_imgs">
                <img class="viloes_child" src="./imagens/viloes/bowser.jpg" alt="">
                <img class="viloes_child" src="./imagens/viloes/drybones.jpg" alt="">
                <img class="viloes_child" src="./imagens/viloes/waluigi.jpg" alt="">
                <img class="viloes_child" src="./imagens/viloes/wario.jpg" alt="">
            </div>
        </div>
    </section>
    <section class="final" id="final">
        <h1 class="final_h1">E salve o reino!</h1>
        <div class="final_img">
            <img src="./imagens/final/peach.png" alt="">
            <img src="./imagens/final/castelo.png" alt="">
            <img src="./imagens/final/daisy.png" alt="">
        </div>
    </section>
</body>
</html>
